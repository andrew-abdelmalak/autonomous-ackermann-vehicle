# Monthly, grouped dependency updates with a 14-day cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 14

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 14
      semver-major-days: 14
    ignore:
      # ROS 2 Jazzy on Ubuntu 24.04 ships numpy 1.26; numpy 2 breaks binaries built against it.
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
