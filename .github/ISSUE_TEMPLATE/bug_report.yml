name: Bug report
description: Report something that does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, do not use this form; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Launch command, world file, or minimal code snippet that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      description: Output of `git rev-parse --short HEAD` or the release tag (for example `v1.0.0`).
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, ROS 2 distribution, Gazebo version, Docker image, or MCU target.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant terminal or ROS 2 log output. Remove any secrets first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
