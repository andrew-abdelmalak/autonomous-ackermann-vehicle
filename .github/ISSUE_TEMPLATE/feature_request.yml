name: Feature request
description: Suggest a change or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the scenario in simulation or on hardware and what is missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the node, planner, controller, or firmware change you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds or existing parameters you tested.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
