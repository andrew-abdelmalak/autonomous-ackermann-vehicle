<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous Ackermann Vehicle</title>
  <desc id="desc">ROS 2 Jazzy planning, PID and Stanley control, Kalman localization, and embedded firmware</desc>

  <rect width="1280" height="640" fill="#0F172A"/>
  <rect x="0" y="0" width="16" height="640" fill="#38BDF8"/>

  <!-- Racing track wall boundaries + quintic lane-change spline dodging both lane obstacles -->
  <g opacity="0.24" stroke="#94A3B8" stroke-width="2" fill="none">
    <line x1="760" y1="115" x2="1200" y2="115"/>
    <line x1="760" y1="235" x2="1200" y2="235"/>
    <line x1="760" y1="175" x2="1200" y2="175" stroke-dasharray="10 10"/>
  </g>
  <rect x="900" y="130" width="38" height="32" rx="4" fill="#F59E0B" opacity="0.9"/>
  <rect x="1065" y="188" width="38" height="32" rx="4" fill="#F59E0B" opacity="0.9"/>
  <path d="M 760 145 C 835 145, 855 205, 920 205 C 990 205, 1020 145, 1085 145 L 1200 145"
        fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

  <!-- Monogram mark -->
  <rect x="80" y="96" width="112" height="112" rx="22" fill="#38BDF8"/>
  <text x="136" y="172" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="56" font-weight="800" fill="#0F172A">AV</text>

  <text x="80" y="330"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="64" font-weight="800" fill="#F8FAFC">Autonomous Ackermann Vehicle</text>

  <text font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="34" font-weight="400" fill="#CBD5E1">
    <tspan x="80" y="400">ROS 2 Jazzy &amp; Gazebo Harmonic autonomy stack</tspan>
    <tspan x="80" y="448">Planning, PID + Stanley control, Kalman filter &amp; Pico firmware</tspan>
  </text>

  <text x="80" y="544"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="26" fill="#38BDF8">github.com/andrew-abdelmalak/autonomous-ackermann-vehicle</text>
</svg>
